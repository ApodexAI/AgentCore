[project]
name = "apodex-agent-core"
version = "0.1.0"
description = "Shared, product-neutral runtime primitives for Apodex agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.12.0"]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.7",
    "pyright[nodejs]>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "FA", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# These async closures are created and awaited inside the same physical-attempt
# iteration; none escapes to observe a later loop binding. B023 cannot infer
# that lifetime and reports every captured attempt-local value.
"agent_core/runtime/loop/_call.py" = ["B023"]

[tool.pyright]
pythonVersion = "3.12"
include = ["agent_core"]
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.7",
    "pyright[nodejs]>=1.1.400",
]
